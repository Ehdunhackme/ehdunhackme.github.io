name: Check election model
on:
  push:
    branches: [main]
    paths: ["research/midterms-2026/**", "scripts/sync-midterms.mjs", ".github/workflows/election-model.yml"]
  pull_request:
    paths: ["research/midterms-2026/**", "scripts/sync-midterms.mjs", ".github/workflows/election-model.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: election-model-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/midterms-2026
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: research/midterms-2026/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m election_forecast build
      - run: python -m pytest -q
      - run: npm ci
      - run: npm run test:live
      - run: npm run article
      - run: npm run check:article
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: election-model-and-preview
          path: |
            research/midterms-2026/site/index.html
            research/midterms-2026/reports/*.csv
            research/midterms-2026/reports/run.json
            research/midterms-2026/test-results/**/*.png
