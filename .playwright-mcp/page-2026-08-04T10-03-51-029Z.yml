      - paragraph [ref=e46]: I'm currently building across AI safety evaluation in LLMs, mechanistic interpretability, and AI4Astro. My research interest lies in understanding how models work internally (layer-wise) and how this information can advance our progress in AI, while making sure they're safe to deploy in real-world settings.
