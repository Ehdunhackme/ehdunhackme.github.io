    - generic [ref=f2e45]:
      - paragraph [ref=f2e46]: I'm currently building across AI safety evaluation in LLMs, mechanistic interpretability, and AI4Astro. My research interest lies in understanding how models work internally (layer-wise) and how this information can advance our progress in AI, while making sure they're safe to deploy in real-world settings.
      - paragraph [ref=f2e47]:
        - text: Before that, I represented Malaysia at the International Olympiad on Astronomy and Astrophysics (IOAA) 2025 and the International Astronomy Olympiad (IAO) 2025; I also founded
        - link "MYResearchGuide" [ref=f2e48] [cursor=pointer]:
