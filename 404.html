<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found - Dun Li Chan</title>
    <meta http-equiv="refresh" content="2;url=/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Labil+Grotesk:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = stored || prefers;
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="zh">中文</button>
        </div>
        <button type="button" class="header-btn theme-toggle" aria-label="Switch color scheme">
          <span class="icon" aria-hidden="true">&#9680;</span>
          <span class="label">Dark</span>
        </button>
      </div>
    </header>
    <main class="page">
      <section class="page-shell">
        <h1 data-i18n="title">Page not found</h1>
        <p class="page-intro" data-i18n="intro">Redirecting to the home page.</p>
        <nav class="page-links">
          <a href="/" data-i18n="home">Go home</a>
        </nav>
      </section>
    </main>
    <script>
      (function () {
        var I18N = {
          en: { title: 'Not Found - Dun Li Chan', title_h: 'Page not found', intro: 'Redirecting to the home page.', home: 'Go home', dark: 'Dark', light: 'Light' },
          zh: { title: '页面未找到 - 曾敦礼', title_h: '页面未找到', intro: '正在跳转到首页。', home: '返回首页', dark: '深色', light: '浅色' }
        };
        var root = document.documentElement;
        var lang = localStorage.getItem('lang') === 'zh' ? 'zh' : 'en';
        var toggle = document.querySelector('.theme-toggle');
        var label = toggle ? toggle.querySelector('.label') : null;
        function updateTheme() {
          var dark = root.classList.contains('dark');
          if (label) label.textContent = dark ? I18N[lang].light : I18N[lang].dark;
        }
        function apply() {
          var d = I18N[lang];
          root.lang = lang;
          document.title = d.title;
          var meta = document.querySelector('meta[name="description"]');
          if (meta) meta.setAttribute('content', d.meta);
          document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var k = el.getAttribute('data-i18n');
            if (d[k] !== undefined) el.textContent = d[k];
          });
          document.querySelectorAll('.lang-btn').forEach(function (b) {
            b.classList.toggle('is-active', b.getAttribute('data-lang') === lang);
          });
          updateTheme();
        }
        if (toggle) toggle.addEventListener('click', function () {
          root.classList.toggle('dark');
          localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
          updateTheme();
        });
        document.querySelectorAll('.lang-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            lang = b.getAttribute('data-lang');
            localStorage.setItem('lang', lang);
            apply();
          });
        });
        apply();
      })();
    </script>
  </body>
</html>
