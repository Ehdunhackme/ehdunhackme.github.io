<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Dun Li Chan</title>
    <meta name="description" content="Contact Dun Li Chan.">
    <meta name="author" content="Dun Li Chan">
    <link rel="canonical" href="https://dunlichan.com/contact/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dun Li Chan">
    <meta property="og:title" content="Contact - Dun Li Chan">
    <meta property="og:description" content="Contact Dun Li Chan.">
    <meta property="og:url" content="https://dunlichan.com/contact/">
    <meta property="og:image" content="https://dunlichan.com/og-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact - Dun Li Chan">
    <meta name="twitter:description" content="Contact Dun Li Chan.">
    <meta name="twitter:image" content="https://dunlichan.com/og-preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Labil+Grotesk:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = stored || prefers;
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="zh">中文</button>
        </div>
        <button type="button" class="header-btn theme-toggle" aria-label="Switch color scheme">
          <span class="icon" aria-hidden="true">&#9680;</span>
        </button>
      </div>
    </header>
    <main class="page">
      <section class="page-shell">
        <h1 data-i18n="contact">Contact</h1>
        <p class="page-intro" data-i18n="intro">Reach out for research collaborations or academic queries.</p>
        <div class="contact-list">
          <p><strong data-i18n="lbl.email">Email:</strong> <a href="mailto:dunlinmy88@gmail.com">dunlinmy88@gmail.com</a></p>
          <p>
            <strong>GitHub:</strong>
            <a href="https://github.com/ehdunhackme" target="_blank" rel="noopener">
              github.com/ehdunhackme
            </a>
          </p>
          <p>
            <strong>LinkedIn:</strong>
            <a href="https://www.linkedin.com/in/dun-li-chan" target="_blank" rel="noopener">
              linkedin.com/in/dun-li-chan
            </a>
          </p>
          <p>
            <strong data-i18n="lbl.scholar">Google Scholar:</strong>
            <a
              href="https://scholar.google.com/citations?user=UOYqiG4AAAAJ"
              target="_blank"
              rel="noopener"
            >
              scholar.google.com
            </a>
          </p>
        </div>
        <nav class="page-links">
          <a href="/" data-i18n="home">Home</a>
          <a href="/writings/" data-i18n="writings">Writings</a>
        </nav>
      </section>
    </main>
    <script>
      (function () {
        var I18N = {
          en: { title: 'Contact - Dun Li Chan', meta: 'Contact Dun Li Chan.', contact: 'Contact', intro: 'Reach out for research collaborations or academic queries.', 'lbl.email': 'Email:', 'lbl.scholar': 'Google Scholar:', home: 'Home', writings: 'Writings', dark: 'Dark', light: 'Light' },
          zh: { title: '联系 - 曾敦礼', meta: '联系曾敦礼。', contact: '联系', intro: '欢迎就研究合作或学术问题与我联系。', 'lbl.email': '邮箱：', 'lbl.scholar': '谷歌学术：', home: '首页', writings: '文章', dark: '深色', light: '浅色' }
        };
        var root = document.documentElement;
        var lang = localStorage.getItem('lang') === 'zh' ? 'zh' : 'en';
        var toggle = document.querySelector('.theme-toggle');
        function updateTheme() {
          var dark = root.classList.contains('dark');
        }
        function apply() {
          var d = I18N[lang];
          root.lang = lang;
          document.title = d.title;
          var meta = document.querySelector('meta[name="description"]');
          if (meta) meta.setAttribute('content', d.meta);
          document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var k = el.getAttribute('data-i18n');
            if (d[k] !== undefined) el.textContent = d[k];
          });
          document.querySelectorAll('.lang-btn').forEach(function (b) {
            b.classList.toggle('is-active', b.getAttribute('data-lang') === lang);
          });
          updateTheme();
        }
        if (toggle) toggle.addEventListener('click', function () {
          root.classList.toggle('dark');
          localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
          updateTheme();
        });
        document.querySelectorAll('.lang-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            lang = b.getAttribute('data-lang');
            localStorage.setItem('lang', lang);
            apply();
          });
        });
        apply();
      })();
    </script>
  </body>
</html>
