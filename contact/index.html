<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Dun Li Chan</title>
    <meta name="description" content="Contact Dun Li Chan.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Labil+Grotesk:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = stored || prefers;
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-actions">
        <button type="button" class="header-btn theme-toggle" aria-label="Switch color scheme">
          <span class="icon" aria-hidden="true">&#9680;</span>
          <span class="label">Dark</span>
        </button>
      </div>
    </header>
    <main class="page">
      <section class="page-shell">
        <h1>Contact</h1>
        <p class="page-intro">Reach out for research collaborations or academic queries.</p>
        <div class="contact-list">
          <p><strong>Email:</strong> <a href="mailto:dunlinmy88@gmail.com">dunlinmy88@gmail.com</a></p>
          <p>
            <strong>GitHub:</strong>
            <a href="https://github.com/ehdunhackme" target="_blank" rel="noopener">
              github.com/ehdunhackme
            </a>
          </p>
          <p>
            <strong>LinkedIn:</strong>
            <a href="https://www.linkedin.com/in/dun-li-chan" target="_blank" rel="noopener">
              linkedin.com/in/dun-li-chan
            </a>
          </p>
          <p>
            <strong>Google Scholar:</strong>
            <a
              href="https://scholar.google.com/citations?user=UOYqiG4AAAAJ"
              target="_blank"
              rel="noopener"
            >
              scholar.google.com
            </a>
          </p>
        </div>
        <nav class="page-links">
          <a href="/">Home</a>
          <a href="/writings/">Writings</a>
        </nav>
      </section>
    </main>
    <script>
      (function () {
        var root = document.documentElement;
        var toggle = document.querySelector('.theme-toggle');
        var label = toggle.querySelector('.label');
        function update() {
          var dark = root.classList.contains('dark');
          label.textContent = dark ? 'Light' : 'Dark';
          toggle.setAttribute('aria-label', 'Switch to ' + (dark ? 'light' : 'dark') + ' mode');
        }
        toggle.addEventListener('click', function () {
          root.classList.toggle('dark');
          localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
          update();
        });
        update();
      })();
    </script>
  </body>
</html>
