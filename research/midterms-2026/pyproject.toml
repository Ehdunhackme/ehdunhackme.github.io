[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "us-election-forecast"
version = "1.0.0"
description = "A 13-model historical benchmark and one selected model for every 2026 House and Senate contest"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<4", "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
