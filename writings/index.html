    <link rel="stylesheet" href="../draft/style.css">
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = stored || prefers;
        if (theme === 'dark') document.documentElement.classList.add('dark');
})();
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-wordmark" href="/" aria-label="Dun Li Chan"><span>D</span><span>U</span><span>N</span><span>&nbsp;</span><span>L</span><span>I</span><span>&nbsp;</span><span>C</span><span>H</span><span>A</span><span>N</span></a>
      <div class="header-actions">
        <button type="button" class="theme-toggle" aria-label="Switch color scheme"><span aria-hidden="true">◐</span></button>
      </div>
    </header>
    <main class="page">
      <section class="page-shell">
        <h1 data-i18n="heading">Writings</h1>
        <ul class="writing-list writing-posts">
          <li>
            <a class="writing-section-link" href="my-opinionated-guide-to-starting-research-early/">
              <span>
                <span class="writing-section-title" data-i18n="post.research.title">My opinionated guide to starting research early</span>
                <span class="writing-section-description" data-i18n="post.research.description">An opinionated guide for high schoolers in Malaysia who want to work on cool research projects early.</span>
              </span>
              <span class="writing-section-side">

              </span>
            </a>
          </li>
        </ul>
        <nav class="page-links">
          <a href="../" data-i18n="home">Home</a>
          <a href="../contact/" data-i18n="contact">Contact</a>
        </nav>
      </section>
    </main>
    <script>
      (function () {
        var I18N = {
          en: { title: 'Writings - Dun Li Chan', meta: 'Technical notes and research writing by Dun Li Chan.', heading: 'Writings', 'post.research.title': 'My opinionated guide to starting research early', 'post.research.description': 'An opinionated guide for high schoolers in Malaysia who want to work on cool research projects early.', home: 'Home', contact: 'Contact', dark: 'Dark', light: 'Light' },
          zh: { title: '文章 - 曾敦礼', meta: '曾敦礼的技术笔记与研究文章。', heading: '文章', 'post.research.title': '我对尽早开始科研的个人观点指南', 'post.research.description': '一份为想及早参与酷炫科研项目的马来西亚高中生准备的个人观点指南。', home: '首页', contact: '联系', dark: '深色', light: '浅色' }
        };
        var root = document.documentElement;
        var lang = 'en';
        var toggle = document.querySelector('.theme-toggle');
        function updateTheme() {
          var dark = root.classList.contains('dark');
        }
        function apply() {
          var d = I18N[lang];
          root.lang = lang;
          document.title = d.title;
          var meta = document.querySelector('meta[name="description"]');
          if (meta) meta.setAttribute('content', d.meta);
          document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var k = el.getAttribute('data-i18n');
            if (d[k] !== undefined) el.textContent = d[k];
          });
          document.querySelectorAll('.lang-btn').forEach(function (b) {
            b.classList.toggle('is-active', b.getAttribute('data-lang') === lang);
          });
          updateTheme();
        }
        if (toggle) toggle.addEventListener('click', function () {
          root.classList.toggle('dark');
          localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
          updateTheme();
        });
        document.querySelectorAll('.lang-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            lang = b.getAttribute('data-lang');
            localStorage.setItem('lang', lang);
            apply();
          });
        });
        apply();
      })();
    </script>
  </body>
</html>
